<VirtualHost *:80>
    ServerName _default_
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Keep API, Sanctum, and readiness requests on Laravel even if the
    # container's .htaccess overrides are unavailable. All other unknown
    # browser paths are served by the compiled React application.
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteRule ^/(?:api|sanctum)(/.*)?$ /index.php$1 [END]
        RewriteRule ^/(health|up)$ /index.php/$1 [END]
        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
        RewriteRule ^/(.*)$ /index.html [END]
    </IfModule>

    DirectoryIndex index.html index.php

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
